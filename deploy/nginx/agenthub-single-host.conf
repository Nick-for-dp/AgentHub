# AgentHub single-host dual-profile trial entrypoints.
# Install as /etc/nginx/sites-available/agenthub-single-host.conf.
# Backends remain loopback-only; the browser sees one IP with ports 8080/8081.

upstream agenthub_external_backend {
    server 127.0.0.1:8240;
    keepalive 64;
}

upstream agenthub_internal_backend {
    server 127.0.0.1:8241;
    keepalive 32;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /opt/agenthub/repo/frontend/dist/external;

    access_log /var/log/nginx/agenthub-external.access.log;
    error_log /var/log/nginx/agenthub-external.error.log warn;
    client_max_body_size 20m;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://agenthub_external_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_cache off;
    }

    location = /health {
        proxy_pass http://agenthub_external_backend;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ { return 404; }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location = /version.json {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location ~ /\. { deny all; }
}

server {
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name _;
    root /opt/agenthub/repo/frontend/dist/internal;

    # The generated include contains one or more `allow <CIDR>;` directives.
    # `deny all` remains in this template so an empty include fails closed.
    include /etc/agenthub/internal-allowlist.conf;
    deny all;

    access_log /var/log/nginx/agenthub-internal.access.log;
    error_log /var/log/nginx/agenthub-internal.error.log warn;
    client_max_body_size 100m;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://agenthub_internal_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        # Blocking execute paths and long document workflows need up to 30 minutes.
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_cache off;
    }

    location = /health {
        proxy_pass http://agenthub_internal_backend;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ { return 404; }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location = /version.json {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location ~ /\. { deny all; }
}
