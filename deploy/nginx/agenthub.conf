# AgentHub Nginx 配置
#
# 部署位置：/etc/nginx/sites-available/agenthub.conf
# 软链激活：sudo ln -s /etc/nginx/sites-available/agenthub.conf /etc/nginx/sites-enabled/
# 检查语法：sudo nginx -t
# 平滑加载：sudo nginx -s reload   # 修改配置后用这个，不会断现有连接
#
# 部署拓扑（A/A/A 决策）：
#   - 单域名前后端同站：用户只看到 https://agenthub.example.com
#   - / 由 Nginx 直接托管前端静态文件
#   - /api/ 反代到本机回环 127.0.0.1:8240（FastAPI）
#   - HTTP 段现在使用；HTTPS 段注释保留，将来取消注释即可
#
# 关键安全约束：
#   - 后端只听 127.0.0.1:8240，公网够不到（见 deploy/systemd/agenthub-backend.service）
#   - X-Forwarded-* 头由 Nginx 设置，后端 --forwarded-allow-ips=127.0.0.1 只信本机来的
#   - 生产关闭 /docs /redoc /openapi.json，避免泄漏 API 形态
#   - 静态资源带 1 年强缓存，index.html 不缓存（避免前端发版后用户拿到旧版）

# ─────────────────────────────────────────────────────────────
# upstream：把后端的地址命名一下，方便复用 + 将来扩缩容
# ─────────────────────────────────────────────────────────────
upstream agenthub_backend {
    # 后端只有一个进程时这一行就够了。
    # 将来要多进程负载均衡，在这里加几行 server 127.0.0.1:8241; 即可。
    server 127.0.0.1:8240;

    # keepalive：复用到后端的 TCP 连接，减少握手开销。
    # 64 是连接池大小，对中小流量足够。
    keepalive 64;
}

# ─────────────────────────────────────────────────────────────
# HTTP 入口（当前阶段使用）
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    # 当前阶段：纯内网部署，使用 hosts 别名 + 直接 IP 双路接入。
    # - agenthub.intra ：内网 hosts/DNS 别名（推荐访问方式），见 deploy/hosts.example
    # - 10.128.140.208 ：AgentHub 应用机内网 IP，无别名时兜底访问
    # - _              ：通配，避免请求 Host 头不一致时被 default server 拒绝
    # 将来上 HTTPS / 走真实域名时，server_name 改为正式域名即可。
    server_name agenthub.intra 10.128.140.208 _;

    # ── 日志位置 ──
    # access_log 记录每次请求，error_log 记录异常。
    # 配合 deploy/logrotate/agenthub 做轮转，避免磁盘塞满。
    access_log /var/log/nginx/agenthub.access.log;
    error_log  /var/log/nginx/agenthub.error.log warn;

    # ── 请求体大小上限 ──
    # 默认 1MB 太小，音频上传接口允许到 15MB（见 audio.py 的 MAX_AUDIO_UPLOAD_BYTES）。
    # 这里设 20MB 给个余量，超过 Nginx 直接返回 413，不会浪费后端资源。
    client_max_body_size 20m;

    # ── 安全头补充 ──
    # 注：CSP frame-ancestors / X-Content-Type-Options / Referrer-Policy 已在
    # 后端 app/main.py 的中间件里输出。Nginx 这里加 X-Frame-Options 是对老
    # 浏览器的兜底（现代浏览器优先认 CSP frame-ancestors）。
    add_header X-Frame-Options "DENY" always;

    # ─────────────────────────────────────────────────────
    # 路由 1：/api/ → FastAPI 后端
    # ─────────────────────────────────────────────────────
    location /api/ {
        # 反向代理到后端。注意结尾的 / 处理：
        # location /api/ + proxy_pass http://upstream;   → 原样转发 /api/v1/xxx
        # location /api/ + proxy_pass http://upstream/;  → 剥掉 /api/ 前缀转发为 /v1/xxx
        # 我们要前者：FastAPI 的路由本身就是 /api/v1/xxx。
        proxy_pass http://agenthub_backend;

        # ── 协议与版本 ──
        # HTTP/1.1 是 keepalive 与 chunked transfer-encoding（SSE 依赖）的前提。
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ── 透传真实客户端信息给后端 ──
        # 后端 --proxy-headers + --forwarded-allow-ips=127.0.0.1 会读这些头。
        # Host：浏览器原始域名，用于后端构造绝对 URL。
        proxy_set_header Host              $host;
        # X-Real-IP：真实客户端 IP（单一）。
        proxy_set_header X-Real-IP         $remote_addr;
        # X-Forwarded-For：完整代理链（如有多层代理，会追加）。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto：用户访问时用的是 http 还是 https。
        # 后端可据此生成跳转 URL；HTTPS 段会自动变成 "https"。
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Forwarded-Host：原始 Host 头，多层代理时有用。
        proxy_set_header X-Forwarded-Host  $host;

        # ── 超时设置 ──
        # connect：与后端建立连接的超时；后端就在本机，给 5s 足够。
        proxy_connect_timeout 5s;
        # send：把请求发给后端的超时；正常请求几十毫秒，给 60s 兜底。
        proxy_send_timeout    60s;
        # read：等后端响应的超时；★ 对 SSE 极重要：
        #   - 普通请求几秒内就响应完
        #   - SSE 流式响应可能持续几分钟（用户等大模型生成）
        # 设 600s = 10 分钟，覆盖最长的 LLM 响应。如果 LLM 偶有更长生成，可调大。
        proxy_read_timeout    600s;

        # ★ ── SSE 关键配置：禁用响应缓冲 ──
        # Nginx 默认会把后端响应攒成块再发给浏览器（性能优化）。
        # 但 SSE 是"后端写一字节，前端就要看到一字节"的模式。
        # proxy_buffering off 关闭缓冲，事件实时到达浏览器。
        proxy_buffering off;
        # 同时禁用请求体缓冲，让上传也是流式（音频文件较大时有意义）。
        proxy_request_buffering off;
        # 兜底：明确告诉后端"不要 gzip"，避免 gzip 压缩破坏流式特性。
        proxy_set_header Accept-Encoding "";

        # ── HTTP 缓存禁用 ──
        # API 响应绝不缓存（与下方静态资源的强缓存形成对比）。
        proxy_cache off;
    }

    # ─────────────────────────────────────────────────────
    # 路由 2：/health → 后端健康检查（监控/探活用）
    # ─────────────────────────────────────────────────────
    # 单独抽出来是因为 /health 不带 /api/ 前缀（见 app/main.py:40）。
    # 这条规则让外部监控可直接 curl http://agenthub.example.com/health。
    location = /health {
        proxy_pass http://agenthub_backend;
        proxy_set_header Host $host;
        access_log off;  # 健康检查频繁，不污染访问日志
    }

    # ─────────────────────────────────────────────────────
    # 路由 3：关闭生产环境不该暴露的接口
    # ─────────────────────────────────────────────────────
    # Swagger UI / ReDoc / OpenAPI Schema —— 等于一份"API 说明书"
    # 开发期方便，生产期收掉，减少攻击面。
    # 如果你的运维/接入方需要看接口，让他们通过 VPN / 内网访问后端 8240 直连。
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # ─────────────────────────────────────────────────────
    # 路由 4：/ → 前端静态文件（Vue SPA）
    # ─────────────────────────────────────────────────────
    location / {
        # 前端 npm run build 产物目录。部署时把 frontend/dist 复制到这里。
        root /opt/agenthub/frontend/dist;
        # 首页文件名。
        index index.html;

        # ★ SPA 路由 fallback：
        # 用户刷新 /chat 时，浏览器向 Nginx 要 "/chat" 这个文件 —— 不存在。
        # try_files 的逻辑：
        #   1. 先找 $uri（即 /chat 文件）—— 不存在
        #   2. 再找 $uri/（即 /chat/ 目录）—— 不存在
        #   3. 兜底返回 /index.html，让 Vue Router 在浏览器端接管路由
        try_files $uri $uri/ /index.html;

        # ── 静态资源缓存策略（关键，影响发版体验）──
        # Vite 构建出的 /assets/* 文件名带 hash（如 app.a3f5c.js），
        # 内容变了文件名一定变 —— 所以可以强缓存 1 年。
        location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # index.html 必须不缓存：
        # 它是 SPA 的入口，里面会引用最新的 hash 文件名。
        # 如果缓存了 index.html，用户发版后会拿到旧版 + 引用旧 hash 文件 → 404 风暴。
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ─────────────────────────────────────────────────────
    # 拒绝隐藏文件访问（.env、.git 等）
    # ─────────────────────────────────────────────────────
    # 兜底防护：如果有人误把 .env 复制到前端目录，这条会挡住。
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

