# AgentHub Nginx 配置（三段式端口布局，ADR-022 2026-08-20 实施修正）
#
# 部署位置：/etc/nginx/sites-available/agenthub.conf
# 软链激活：sudo ln -s /etc/nginx/sites-available/agenthub.conf /etc/nginx/sites-enabled/
# 检查语法：sudo nginx -t
# 平滑加载：sudo systemctl reload nginx   # 修改配置后用这个，不会断现有连接
#
# ── 三段式布局（管理面与公网面端口级隔离）──
#   1. 公网嵌入块  :80  server_name agent.zjmi56.com
#      公网唯一入口。公司网关做 TLS 卸载（证书在网关），公网 443 解密后明文
#      转发到本机 80，本机不开 443、不碰证书。只放行嵌入问答必需路径。
#   2. 内网客户块  :80  server_name agenthub.intra / 10.128.140.208 / 默认兜底
#      内网客户聊天、登录、联调、健康检查。/admin 与 /api/v1/admin/ 一律 404。
#   3. 内网管理块  :81  server_name agenthub.intra / 10.128.140.208
#      完整站点（含管理后台）。仅内网可达，公网防火墙永不映射 81。
#
# 关键安全约束：
#   - 后端只听 127.0.0.1:8240，公网够不到（见 deploy/systemd/agenthub-backend.service）
#   - X-Forwarded-* 头由 Nginx 设置，后端 --forwarded-allow-ips=127.0.0.1 只信本机来的
#   - 公网流量的真实客户端 IP 经多层代理在 X-Forwarded-For 链中，不可可靠还原
#     （网管 2026-08-20 确认），故公网块全链记录 XFF 日志，限流只做粗粒度防洪
#   - 生产关闭 /docs /redoc /openapi.json，避免泄漏 API 形态
#   - 静态资源带 1 年强缓存，index.html 不缓存（避免前端发版后用户拿到旧版）
#
# ── 为什么公网块没有 SSL 配置 ──
#   TLS 在公司网关终止（网关 TLS 卸载形态），本机收到的已是明文 HTTP。
#   浏览器侧全程 HTTPS，embed Cookie 的 Secure + SameSite=None 不受影响
#   （Set-Cookie 经网关 TLS 送达浏览器即生效）。HSTS 头由本机输出、经网关
#   加密通道送达，浏览器照常生效。

# ─────────────────────────────────────────────────────────────
# upstream：把后端的地址命名一下，方便复用 + 将来扩缩容
# ─────────────────────────────────────────────────────────────
upstream agenthub_backend {
    # 后端只有一个进程时这一行就够了。
    # 将来要多进程负载均衡，在这里加几行 server 127.0.0.1:8241; 即可。
    server 127.0.0.1:8240;

    # keepalive：复用到后端的 TCP 连接，减少握手开销。
    # 64 是连接池大小，对中小流量足够。
    keepalive 64;
}

# ─────────────────────────────────────────────────────────────
# 公网块专用：日志格式与限流区
# ─────────────────────────────────────────────────────────────

# 公网访问日志额外记录完整 X-Forwarded-For 链：真实客户端 IP 藏在多层
# 代理链里（网管确认"可能有好多层，全部记录"），出问题时顺链排查。
log_format agenthub_public '$remote_addr - [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" xff="$http_x_forwarded_for"';

# 粗粒度防洪限流：公网请求的 $remote_addr 全是网关 IP（真实来源不可
# 可靠还原），无法按真实客户端限流，故按网关整体限一个宽松阈值——
# 只挡流量风暴，精细化防滥用由 embed token 校验承担（ADR-022 主防线）。
# 10r/s = 每来源 600 请求/分钟，联调与试运行期够用；正式放量后可再调。
limit_req_zone $binary_remote_addr zone=agenthub_public:10m rate=10r/s;

# ═════════════════════════════════════════════════════════════
# 块 1：公网嵌入入口（agent.zjmi56.com，ADR-022）
# 公司网关 TLS 卸载后明文转发到本机 80；本块按 Host 命中，只放行嵌入
# 问答必需路径，其余一律 404。管理面在本端口根本不存在（不止是拦截）。
# ═════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name agent.zjmi56.com;

    access_log /var/log/nginx/agenthub.public.access.log agenthub_public;
    error_log  /var/log/nginx/agenthub.public.error.log warn;

    client_max_body_size 20m;

    # HSTS：公网启用（ADR-022）。头经网关 TLS 通道送达浏览器，按域名生效。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 老浏览器兜底；现代浏览器以后端 CSP frame-ancestors 为准（设计如此）。
    # 注意：本块绝不能再加第二条 CSP 头（多条 CSP 按交集生效），否则会把
    # 后端为嵌入页输出的 frame-ancestors <博采 origin> 锁成 'none'。
    add_header X-Frame-Options "DENY" always;

    # ── 嵌入页（Vue SPA 的 /embed/chat）──
    location /embed/ {
        root /opt/agenthub/frontend/dist;
        try_files $uri /index.html;
    }

    location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        root /opt/agenthub/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        root /opt/agenthub/frontend/dist;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── API 白名单：仅嵌入问答必需三条 ──
    # embed session 建立/续期/登出（限流防 token 暴力试探）
    location /api/v1/embed/ {
        limit_req zone=agenthub_public burst=20 nodelay;
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 网关不一定传 proto（网管确认），后端对 scheme 零使用，写 $scheme 仅留档
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_cache off;
    }

    # SSE 流式问答（限流防洪；长连接本身不占请求数）
    location /api/v1/chat/ {
        limit_req zone=agenthub_public burst=60 nodelay;
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    600s;   # SSE 长流，勿调小
        proxy_buffering off;          # SSE 关键：禁用缓冲
        proxy_request_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_cache off;
    }

    # 语音转写/合成（上传体较大，不进限流，避免正常语音被误伤）
    location /api/v1/audio/ {
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_cache off;
    }

    # ── 其余一切 404：/admin、/api/v1/admin/、/api/v1/auth/、
    #    /api/v1/conversations、/docs、/health 等全部不暴露 ──
    location / {
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ═════════════════════════════════════════════════════════════
# 块 2：内网客户入口（80，agenthub.intra / IP / 默认兜底）
# 客户聊天、登录、纯 API 联调、健康检查。管理面一律 404：
# 即使未来网关 Host 转发出错，公网流量落进本块也摸不到管理后台。
# ═════════════════════════════════════════════════════════════
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # 内网 hosts/DNS 别名（推荐）+ 直接 IP 兜底 + 未知 Host 兜底进本块
    # （本块是全端口最严的客户面，兜底落这里不会提权）。
    server_name agenthub.intra 10.128.140.208 _;

    access_log /var/log/nginx/agenthub.access.log;
    error_log  /var/log/nginx/agenthub.error.log warn;

    # 默认 1MB 太小，音频上传接口允许到 15MB（见 audio.py 的 MAX_AUDIO_UPLOAD_BYTES）。
    client_max_body_size 20m;

    # 点击劫持加固：后端一旦配置 EMBED_ALLOWED_PARENT_ORIGINS，会对所有响应
    # 输出 frame-ancestors <博采 origin>（含本块页面）。多条 CSP 头按交集生效，
    # 这里补一条 'none' 把内网页面锁回不可被嵌入；公网嵌入块不受影响。
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # X-Frame-Options 是对老浏览器的兜底（现代浏览器优先认 CSP）。
    add_header X-Frame-Options "DENY" always;

    # ── 管理面在本块不存在（管理后台在 :81，见块 3）──
    location /admin {
        return 404;
    }

    location /api/v1/admin/ {
        return 404;
    }

    # ─────────────────────────────────────────────────────
    # 路由 1：/api/ → FastAPI 后端
    # ─────────────────────────────────────────────────────
    location /api/ {
        # location /api/ + proxy_pass http://upstream; → 原样转发 /api/v1/xxx
        # （FastAPI 的路由本身就是 /api/v1/xxx）。
        proxy_pass http://agenthub_backend;

        # HTTP/1.1 是 keepalive 与 chunked transfer-encoding（SSE 依赖）的前提。
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 透传真实客户端信息给后端（--proxy-headers + --forwarded-allow-ips=127.0.0.1 会读）。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # connect：后端就在本机，5s 足够。read：★ 对 SSE 极重要，
        # 流式响应可能持续几分钟，设 600s 覆盖最长 LLM 响应。
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    600s;

        # ★ SSE 关键：禁用响应缓冲，事件实时到达浏览器。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Accept-Encoding "";

        # API 响应绝不缓存。
        proxy_cache off;
    }

    # ─────────────────────────────────────────────────────
    # 路由 2：/health → 后端健康检查（/health 不带 /api/ 前缀）
    # ─────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://agenthub_backend;
        proxy_set_header Host $host;
        access_log off;  # 健康检查频繁，不污染访问日志
    }

    # ─────────────────────────────────────────────────────
    # 路由 3：关闭生产环境不该暴露的接口（Swagger/ReDoc/OpenAPI）
    # ─────────────────────────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # ─────────────────────────────────────────────────────
    # 路由 4：/ → 前端静态文件（Vue SPA）
    # ─────────────────────────────────────────────────────
    location / {
        root /opt/agenthub/frontend/dist;
        index index.html;

        # SPA 路由 fallback：刷新 /chat 时服务端无此文件，兜底回 index.html
        # 让 Vue Router 在浏览器端接管。
        try_files $uri $uri/ /index.html;

        # Vite 产物 /assets/* 文件名带 hash，内容变文件名必变 → 强缓存 1 年。
        location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # index.html 必须不缓存（它引用最新 hash 文件，缓存会导致发版后 404 风暴）。
        # 本 location 自带 add_header 会屏蔽 server 级 add_header，CSP 头需重写一次。
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
    }

    # 拒绝隐藏文件访问（.env、.git 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ═════════════════════════════════════════════════════════════
# 块 3：内网管理入口（81，完整站点含管理后台）
# ★ 仅内网可达，公网防火墙永不映射 81（与网管书面确认项）。
# ═════════════════════════════════════════════════════════════
server {
    listen 81;
    listen [::]:81;
    # 81 上只有本块，任何 Host 都落这里（内网默认全量服务）。
    server_name agenthub.intra 10.128.140.208 _;

    access_log /var/log/nginx/agenthub.admin.access.log;
    error_log  /var/log/nginx/agenthub.admin.error.log warn;

    client_max_body_size 20m;

    # 点击劫持加固：管理页绝不允许被任何站点 iframe 嵌入（交集生效，见块 2 注释）。
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    # ── /api/ → FastAPI 后端（全量，含 /api/v1/admin/*）──
    location /api/ {
        proxy_pass http://agenthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_cache off;
    }

    location = /health {
        proxy_pass http://agenthub_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # ── / → 前端静态文件（完整 SPA，含 /admin）──
    location / {
        root /opt/agenthub/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ─────────────────────────────────────────────────────────────
# 历史注释：纯内网 HTTPS 双栈模板（ADR-021）已移除
# 公网嵌入走网关 TLS 卸载（本机不开 443），管理面在 81。若未来出现纯内网
# iframe 嵌入需求（须 HTTPS 才能种 Secure Cookie），按 ADR-021 与
# deploy/public-embed.md 的原则另行启用，模板可从 git 历史找回。
# ─────────────────────────────────────────────────────────────
