schema: spec-driven

# 项目上下文：创建 proposal / design / tasks 等 artifact 时由 AI 读取。
# 这里只放指针与红线摘要，事实以仓库内文档为准，避免重复维护。
context: |
  AgentHub 是 RAG 驱动的对外智能体应用平台，专注服务外部客户问答与营销场景。
  Dify 是可替换的 runtime/provider，不是平台核心边界。对内智能体平台（合同审查、
  风控助手等）已拆分到独立项目 Citadel，AgentHub 只保留 external 一种部署形态。

  平台支持两类访问方式，均统一为 AuthenticatedSubject：管理员/授权员工账号密码
  登录后台（Cookie session）；iframe 嵌入官网或目标网站（embed session）；
  外部系统调用（API Key）。未来新增鉴权方式只需增加一种 subject 解析来源。

  技术栈：后端 Python + FastAPI + SQLAlchemy + Alembic + MySQL 8；
  前端 Vue 3 + Vite + Ant Design Vue + Pinia + Vue Router；runtime Dify + RAGFlow。

  编码与协作事实以仓库根目录文档为准，创建 artifact 前必须按需读取：
    - Agent.md       协作规则、架构红线、编码规范、文档维护规则（最高优先）
    - Archi.md       最新系统架构、关键流程、数据模型边界
    - PLAN.md        当前未完成事项
    - DECISIONS.md   重大架构决策记录（ADR）
    - README.md      启动、目录、常用命令
    - ag.md          架构师工作职责与协作方式（含老K分工）
    - docs/frontend-design.md  前端设计规范（涉及 UI 时必读）
    - docs/ui-review-checklist.md  UI 验收清单（前端改造后必查）

  关键红线（详见 Agent.md 第 4、5 节，编写 design/tasks 不得违反）：
    - 前端、外部客户、业务服务不得直接调用 Dify；调用只能出现在
      backend/app/integrations/dify。
    - 权限默认拒绝；显式 deny 优先于 allow。
    - 每次真正触发 Agent runtime / Dify workflow 的调用必须创建或更新一条
      agent_invocation_record；调用记录快照内部使用 retrieval / model / runtime 子键。
    - 产业互联网 iframe 嵌入必须使用短期 token exchange + AgentHub embed session，
      不允许长期携带外部 token 访问业务接口。
    - 日志不得输出密码、API Key 原文、登录 token、Authorization Header、Dify API Key。

# 各 artifact 的额外规则。
rules:
  proposal:
    - 必须说明本提案对应 PLAN.md 中的哪一项未完成事项，或是否为新增需求。
    - 明确 Non-goals，避免一次提案跨越多个 Agent 类型或多个无关模块。
    - 涉及架构红线的变更必须先在 DECISIONS.md 立项或引用已有 ADR。
  design:
    - 必须对照 Archi.md 的模块/数据模型边界，说明改动落在哪个模块分层
      （endpoint / service / repository / integration client）。
    - 不得让前端、业务服务直接依赖 Dify。
    - 数据库结构变化必须规划 Alembic migration。
  tasks:
    - 任务拆分粒度控制在单次可评审、可回滚范围内，单任务不超过约 2 小时。
    - 涉及 Agent.md 第 9 节列出的能力（手机号、API Key、密码、权限、Agent 路由、
      调用记录、embed 安全边界等）必须写出对应的测试任务。
    - 实现完成后，按 Agent.md 第 11 节把架构事实更新到 Archi.md、变更摘要更新到
      CHANGELOG.md、重大决策更新到 DECISIONS.md。
