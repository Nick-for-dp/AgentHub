[project]
name = "agenthub-backend"
version = "0.1.0"
description = "AgentHub backend service"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "bcrypt>=3.2.0,<5.0.0",
  "boto3>=1.34.0",
  "PyMySQL>=1.1.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "PyJWT>=2.8.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0",
  "uuid6>=2024.1.12",
  "uvicorn[standard]>=0.27.0",
  "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0"
]
internal = [
  "langchain-core>=0.3.0,<2.0.0",
  "langgraph>=0.3.0,<2.0.0",
  "openpyxl>=3.1.5,<4.0.0",
  "python-docx>=1.1.2",
  "pymupdf>=1.24.0"
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark a test as an async test (requires pytest-asyncio)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
